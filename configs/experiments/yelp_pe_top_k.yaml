# Yelp + PE Top-K mechanism (DP, epsilon=1.0)
#
# Example experiment config for Algorithm 2 with annealed top-k.
# The k_top_schedule decreases linearly from 3500 to 500 over 10 rounds,
# concentrating selection on higher-quality candidates as rounds progress.

name: yelp_pe_top_k_dp_eps1
seed: 42
result_folder: result/yelp/pe_top_k_dp_eps1

dataset:
  _include: configs/datasets/yelp.yaml

mechanism:
  _include: configs/mechanisms/pe_top_k.yaml
  threshold_H: 0.0
  k_top_schedule: [3500, 3400, 3300, 3200, 3000, 2800, 2600, 2400, 2200, 2000, 1800]

api:
  type: HFGPT
  model_type: gpt2
  temperature: 1.4
  max_new_tokens: 64
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.0
  do_sample: true
  fp16: true
  use_subcategory: true
  random_sampling_batch_size: 1024
  variation_batch_size: 1024
  variation_type: yelp_rephrase_tone
  mlm_probability: 0.5

# Privacy parameters (epsilon=1.0 -> sigma=15.34)
noise_multiplier: 15.34

# PE loop (DP uses T=10)
num_iterations: 10
num_syn_samples: 5000
L: 7
init_L: 7
lookahead_degree: 0
select_syn_mode: rank
variation_degree: 0.5

feature_extractor: stsb-roberta-base-v2
feature_extractor_batch_size: 1024

tasks:
  - _include: configs/tasks/embedding_metrics.yaml
    embedding_model: stsb-roberta-base-v2
  - _include: configs/tasks/classification_yelp.yaml
